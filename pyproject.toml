[project]
name = "sat-cts-paper"
version = "1.0.0"
description = "Reference implementation for SAT-CTS: Satisficing Combinatorial Thompson Sampling with Binary Feedback for Combinatorial Beam Alignment"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "deepmimo>=4.0.0b11",
    "matplotlib>=3.10",
    "numpy>=1.24,<2",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "tqdm>=4.67",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/obs"]
